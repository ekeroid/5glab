# ServiceAccount for NEF-shim — needs cluster-wide permissions to
# create per-tenant Deployments, Services, Jobs, and PVCs dynamically
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nef-shim
  namespace: edgevision
---
# ClusterRole with permissions to manage tenant compute resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nef-shim-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Bind ServiceAccount to ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nef-shim-binding
subjects:
  - kind: ServiceAccount
    name: nef-shim
    namespace: edgevision
roleRef:
  kind: ClusterRole
  name: nef-shim-role
  apiGroup: rbac.authorization.k8s.io
