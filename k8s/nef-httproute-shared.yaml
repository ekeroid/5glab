# HTTPRoute using the shared lab-gateway in monitoring namespace
# Routes camara.5glab.control.lth.se traffic to the NEF-shim
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nef-shim-route
  namespace: edgevision
spec:
  parentRefs:
    - name: lab-gateway
      namespace: monitoring
  hostnames:
    - camara.5glab.control.lth.se
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nef-shim
          port: 80
