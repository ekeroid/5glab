apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-server
  namespace: open5gs
data:
  benchmark-server.py: |
    #!/usr/bin/env python3
    import socket
    import struct
    import threading
    import time
    import sys

    PORT = 9900
    HEADER_FMT = "!BIId"  # type(1), sequence(4), payload_size(4), timestamp(8)
    HEADER_SIZE = struct.calcsize(HEADER_FMT)

    MSG_PING = 1
    MSG_DOWNLOAD = 2
    MSG_UPLOAD = 3
    MSG_PONG = 4
    MSG_DATA = 5
    MSG_ACK = 6

    def handle_client(conn, addr):
        try:
            while True:
                hdr = recv_exact(conn, HEADER_SIZE)
                if not hdr:
                    break
                msg_type, seq, payload_size, client_ts = struct.unpack(HEADER_FMT, hdr)
                t_recv = time.perf_counter()

                if msg_type == MSG_PING:
                    payload = recv_exact(conn, payload_size)
                    if payload is None:
                        break
                    t_proc = time.perf_counter() - t_recv
                    resp = struct.pack(HEADER_FMT, MSG_PONG, seq, len(payload), t_proc) + payload
                    conn.sendall(resp)

                elif msg_type == MSG_DOWNLOAD:
                    if payload_size > 0:
                        body = recv_exact(conn, payload_size)
                        if body and len(body) >= 4:
                            chunk_size = struct.unpack("!I", body[:4])[0]
                        else:
                            chunk_size = 65536
                    else:
                        chunk_size = 65536
                    data = b'\x00' * chunk_size
                    t_proc = time.perf_counter() - t_recv
                    resp = struct.pack(HEADER_FMT, MSG_DATA, seq, len(data), t_proc) + data
                    conn.sendall(resp)

                elif msg_type == MSG_UPLOAD:
                    payload = recv_exact(conn, payload_size)
                    if payload is None:
                        break
                    t_proc = time.perf_counter() - t_recv
                    resp = struct.pack(HEADER_FMT, MSG_ACK, seq, 0, t_proc)
                    conn.sendall(resp)
        except (ConnectionResetError, BrokenPipeError):
            pass
        finally:
            conn.close()

    def recv_exact(sock, n):
        if n == 0:
            return b''
        buf = bytearray()
        while len(buf) < n:
            chunk = sock.recv(n - len(buf))
            if not chunk:
                return None
            buf.extend(chunk)
        return bytes(buf)

    def main():
        srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        srv.bind(("0.0.0.0", PORT))
        srv.listen(16)
        print(f"Benchmark server listening on port {PORT}", flush=True)
        while True:
            conn, addr = srv.accept()
            conn.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)
            t = threading.Thread(target=handle_client, args=(conn, addr), daemon=True)
            t.start()

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-server
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-server
  template:
    metadata:
      labels:
        app: benchmark-server
    spec:
      containers:
      - name: benchmark
        image: python:3.11-slim
        command: ["python3", "/app/benchmark-server.py"]
        ports:
        - containerPort: 9900
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: benchmark-server
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-server
  namespace: open5gs
spec:
  selector:
    app: benchmark-server
  ports:
  - port: 9900
    targetPort: 9900
  type: ClusterIP
