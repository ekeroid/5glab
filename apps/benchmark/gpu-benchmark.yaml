apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-scripts
  namespace: default
data:
  matrix_multiply.py: |
    import time
    import json
    import sys
    import os

    backend = os.environ.get("BACKEND", "cpu")
    size = int(os.environ.get("MATRIX_SIZE", "4096"))

    if backend == "gpu":
        import torch
        device = torch.device("cuda")
        torch.cuda.synchronize()
        a = torch.randn(size, size, device=device)
        b = torch.randn(size, size, device=device)
        torch.cuda.synchronize()
        start = time.perf_counter()
        for _ in range(10):
            c = torch.mm(a, b)
        torch.cuda.synchronize()
        elapsed = time.perf_counter() - start
    else:
        import numpy as np
        a = np.random.randn(size, size).astype(np.float32)
        b = np.random.randn(size, size).astype(np.float32)
        start = time.perf_counter()
        for _ in range(10):
            c = a @ b
        elapsed = time.perf_counter() - start

    ops = 2 * size**3 * 10
    gflops = ops / elapsed / 1e9
    print(json.dumps({"workload": "matrix_multiply", "backend": backend, "size": size, "iterations": 10, "elapsed_s": round(elapsed, 4), "gflops": round(gflops, 2)}))

  fft_signal.py: |
    import time
    import json
    import os

    backend = os.environ.get("BACKEND", "cpu")
    n_signals = int(os.environ.get("N_SIGNALS", "10000"))
    signal_len = int(os.environ.get("SIGNAL_LEN", "65536"))

    if backend == "gpu":
        import torch
        device = torch.device("cuda")
        data = torch.randn(n_signals, signal_len, device=device)
        torch.cuda.synchronize()
        start = time.perf_counter()
        result = torch.fft.fft(data)
        torch.cuda.synchronize()
        elapsed = time.perf_counter() - start
    else:
        import numpy as np
        data = np.random.randn(n_signals, signal_len).astype(np.float32)
        start = time.perf_counter()
        result = np.fft.fft(data)
        elapsed = time.perf_counter() - start

    throughput = n_signals / elapsed
    print(json.dumps({"workload": "fft_batch", "backend": backend, "n_signals": n_signals, "signal_len": signal_len, "elapsed_s": round(elapsed, 4), "signals_per_sec": round(throughput, 1)}))

  inference.py: |
    import time
    import json
    import os

    backend = os.environ.get("BACKEND", "cpu")
    batch_size = int(os.environ.get("BATCH_SIZE", "256"))
    iterations = int(os.environ.get("ITERATIONS", "100"))

    import torch
    import torch.nn as nn

    class SimpleCNN(nn.Module):
        def __init__(self):
            super().__init__()
            self.features = nn.Sequential(
                nn.Conv2d(3, 64, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),
                nn.Conv2d(64, 128, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),
                nn.Conv2d(128, 256, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),
                nn.Conv2d(256, 512, 3, padding=1), nn.ReLU(), nn.AdaptiveAvgPool2d(1),
            )
            self.classifier = nn.Linear(512, 1000)

        def forward(self, x):
            x = self.features(x)
            x = x.view(x.size(0), -1)
            return self.classifier(x)

    device = torch.device("cuda" if backend == "gpu" else "cpu")
    model = SimpleCNN().to(device).eval()
    dummy = torch.randn(batch_size, 3, 224, 224, device=device)

    # warmup
    with torch.no_grad():
        for _ in range(5):
            _ = model(dummy)
    if backend == "gpu":
        torch.cuda.synchronize()

    start = time.perf_counter()
    with torch.no_grad():
        for _ in range(iterations):
            _ = model(dummy)
    if backend == "gpu":
        torch.cuda.synchronize()
    elapsed = time.perf_counter() - start

    imgs_per_sec = batch_size * iterations / elapsed
    print(json.dumps({"workload": "cnn_inference", "backend": backend, "batch_size": batch_size, "iterations": iterations, "elapsed_s": round(elapsed, 4), "images_per_sec": round(imgs_per_sec, 1)}))

  sort_compress.py: |
    import time
    import json
    import os
    import zlib

    n_elements = int(os.environ.get("N_ELEMENTS", "50000000"))

    import numpy as np
    data = np.random.randint(0, 2**31, size=n_elements, dtype=np.int64)

    # Sort benchmark
    start = time.perf_counter()
    sorted_data = np.sort(data)
    sort_time = time.perf_counter() - start

    # Compression benchmark
    raw = data.tobytes()
    start = time.perf_counter()
    compressed = zlib.compress(raw, level=6)
    compress_time = time.perf_counter() - start

    ratio = len(raw) / len(compressed)
    throughput_mb = len(raw) / compress_time / 1e6

    print(json.dumps({"workload": "sort_compress", "backend": "cpu", "n_elements": n_elements, "sort_time_s": round(sort_time, 4), "compress_time_s": round(compress_time, 4), "compress_ratio": round(ratio, 2), "compress_throughput_mbs": round(throughput_mb, 1)}))

  run_all.sh: |
    #!/bin/bash
    echo "=== GPU/CPU Benchmark Suite ==="
    echo ""
    echo "Running: $WORKLOAD on $BACKEND"
    echo ""
    cd /scripts
    python3 -u $WORKLOAD
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-matrix-gpu
  namespace: default
  labels:
    bench-suite: gpu-cpu-compare
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
      nodeSelector:
        nvidia.com/gpu: "true"
      containers:
      - name: bench
        image: nvcr.io/nvidia/pytorch:24.12-py3
        command: ["bash", "/scripts/run_all.sh"]
        env:
        - name: BACKEND
          value: "gpu"
        - name: WORKLOAD
          value: "matrix_multiply.py"
        - name: MATRIX_SIZE
          value: "8192"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        resources:
          limits:
            nvidia.com/gpu: 1
      volumes:
      - name: scripts
        configMap:
          name: benchmark-scripts
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-matrix-cpu
  namespace: default
  labels:
    bench-suite: gpu-cpu-compare
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k8sv2-2
      containers:
      - name: bench
        image: python:3.12-slim
        command: ["bash", "-c", "pip install -q numpy && bash /scripts/run_all.sh"]
        env:
        - name: BACKEND
          value: "cpu"
        - name: WORKLOAD
          value: "matrix_multiply.py"
        - name: MATRIX_SIZE
          value: "8192"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        resources:
          limits:
            cpu: "8"
            memory: "4Gi"
      volumes:
      - name: scripts
        configMap:
          name: benchmark-scripts
---
