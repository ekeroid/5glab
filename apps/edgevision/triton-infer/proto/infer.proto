syntax = "proto3";

package edgevision;

service InferenceService {
  rpc Infer (InferRequest) returns (InferResponse);
  rpc Health (HealthRequest) returns (HealthResponse);
}

message InferRequest {
  bytes jpeg = 1;
  float confidence_threshold = 2;
  string model = 3;  // "detect" (default) or "seg"
}

message InferResponse {
  repeated Detection detections = 1;
  float latency_ms = 2;
  float preprocess_ms = 3;
  float inference_ms = 4;
  float postprocess_ms = 5;
}

message Detection {
  string label = 1;
  float confidence = 2;
  BBox bbox = 3;
  repeated Point mask_polygon = 4;
}

message BBox {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
}

message Point {
  float x = 1;
  float y = 2;
}

message HealthRequest {}

message HealthResponse {
  bool live = 1;
  string status = 2;
}
