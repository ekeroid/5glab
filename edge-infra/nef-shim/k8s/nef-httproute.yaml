# HTTPRoute — routes all traffic for camara.5glab.control.lth.se to NEF-shim
# This is the single external entry point; Triton is never exposed directly
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nef-shim-route
  namespace: edgevision
spec:
  parentRefs:
    - name: lab-gateway
      namespace: monitoring
  hostnames:
    - camara.5glab.control.lth.se
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nef-shim
          port: 80
